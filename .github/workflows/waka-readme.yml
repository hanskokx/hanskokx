name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs at 12 AM UTC (5:30 AM IST)
    # - cron: "0 0 * * *" # Disabled because it keeps 403'ing

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          CODE_LANG: dart
          STOP_AT_OTHER: true
          IGNORED_LANGUAGES: YAML JSON TOML PHP
